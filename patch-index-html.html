<!-- =========================================================
     PATCH INDEX.HTML — Adicionar no <head>, após o <meta charset>
     ========================================================= -->

<!-- 1. PWA: Manifest -->
<link rel="manifest" href="manifest.json">

<!-- 2. PWA: Cor da barra do navegador (Android Chrome e Safari iOS) -->
<meta name="theme-color" content="#47b05a">

<!-- 3. PWA: Ícone para iOS (Home Screen) -->
<link rel="apple-touch-icon" href="assets/icon-192.png">

<!-- 4. PWA: Splash screen / status bar iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ilha Gigóia">

<!-- 5. Mobile: Formato de telefone não detectável automaticamente -->
<meta name="format-detection" content="telephone=no">

<!-- 6. Mobile-fixes CSS (adicionar APÓS o styles.css) -->
<link rel="stylesheet" href="mobile-fixes.css">


<!-- =========================================================
     PATCH INDEX.HTML — Adicionar antes do </body>
     (substituir ou adicionar após os outros <script>)
     ========================================================= -->

<script>
  // Registro do Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ SW registrado:', reg.scope))
        .catch(err => console.warn('⚠️ SW falhou:', err));
    });
  }
</script>
