<!--
  PAGINA DE PAGAMENTO DO SINAL (23/11/2026, Max e Vinicius).
  A Gigi manda pro cliente ilhadagigoia.com.br/pagar/<token>. Esta pagina pede os dados
  ao /pagar/dados.php, que pergunta a Gigi no Railway. Aqui nao tem segredo nenhum:
  sem um token valido, nao aparece nada.
  Depois que o Pix cai, a pagina vira "Pagamento confirmado" sozinha (consulta a cada 8 s).
  O atributo data-pagina="pagamento-gigi" e' o que a Gigi procura pra saber que o
  endereco /pagar/<token> funciona. Nao remova.
-->

.sinal .l{font-size:14px;line-height:1.35}

.sinal .v{text-align:right;flex:none}

.pix{text-align:center}
.pix h2{font-size:18px}
.pix .sub{font-size:13px;color:var(--muted);margin-top:2px}
.pix img{width:230px;max-width:80%;height:auto;margin:12px auto 4px;display:block;image-rendering:pixelated}
.btn{display:block;width:100%;background:var(--green);color:#fff;border:0;border-radius:13px;padding:15px;font:800 16px 'Manrope',sans-serif;margin-top:10px;cursor:pointer}
.btn.ok{background:var(--green-dark)}
.btn.sec{background:#fff;color:var(--green-dark);border:2px solid var(--green);margin-top:12px;font-size:15px;padding:12px}
.auto{font-size:13px;color:var(--muted);margin-top:8px}
.rec{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:14px;background:#f6faf6;border-radius:12px;padding:11px 12px;text-align:left}
.rec b{color:var(--text)}
.wise h3{font-size:15.5px;margin-bottom:6px}
.wise p{font-size:14px;line-height:1.5;color:#3d4541}
.nota{font-size:12.5px;color:var(--muted);margin-top:8px}
.dep .stars{color:var(--yellow);font-size:17px;letter-spacing:1px}
.dep blockquote{font-size:14px;line-height:1.5;font-style:italic;margin-top:4px}
.dep figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:6px 16px 26px;line-height:1.7}

  function seletor() {
    var el = document.getElementById('langs');
    el.innerHTML = '🌐 ' + Object.keys(NOMES).map(function (k) {
      return '<button type="button" data-l="' + k + '"' + (k === lang ? ' class="on"' : '') + '>' + NOMES[k] + '</button>';
    }).join(' · ');
    el.onclick = function (ev) {
      var b = ev.target.closest('button[data-l]');
      if (!b) return;
      lang = b.getAttribute('data-l'); escolhida = true;
      desenhar();
    };
  }
  function telaSimples(cls, ic, titulo, texto) {
    document.getElementById('app').innerHTML =
      '<div class="card estado ' + cls + '"><div class="ic">' + ic + '</div><h1>' + titulo + '</h1><p>' + texto + '</p></div>';
  }
  function linhasDaReserva() {
    var tt = t();
    return '<div class="row"><span>' + tt.passeio + '</span><span>' + esc(opcaoNoIdioma(dados.opcao)) + '</span></div>' +
      '<div class="row"><span>' + tt.data + '</span><span>' + esc(dataNoIdioma()) + '</span></div>' +
      '<div class="row"><span>' + tt.pessoas + '</span><span>' + esc(pessoasNoIdioma(dados.pessoas)) + '</span></div>' +
      (dados.nome ? '<div class="row"><span>' + tt.nome + '</span><span>' + esc(dados.nome) + '</span></div>' : '') +
      '<div class="row"><span>' + tt.total + '</span><span>' + reais(dados.total) +
        (aprox(dados.total) ? '<span class="aprox">' + aprox(dados.total) + '</span>' : '') + '</span></div>';
  }
  function telaPendente() {
    var tt = t(), d = dados;
    var onde = tt.onde[d.onde] || tt.onde.dia;
    var fora = !!d.taxa || lang !== 'pt';
    var html =
      '<div class="card"><div class="tag">' + tt.vaga + '</div><h1>' + tt.reserva + ' ' + esc(d.codigo) + '</h1>' + linhasDaReserva() +
      '<div class="sinal"><div class="l">' + tt.sinal + '<small>' + esc(tt.resto.replace('{v}', reais(d.resto)).replace('{onde}', onde)) + '</small></div>' +
      '<div class="v"><b>' + reais(d.sinal) + '</b>' + (aprox(d.sinal) ? '<small>' + aprox(d.sinal) + '</small>' : '') + '</div></div></div>' +
      '<div class="card pix"><h2>' + tt.pagueCom + '</h2>' + (lang !== 'pt' ? '<div class="sub">' + tt.pixSub + '</div>' : '') +
      (d.qr ? '<img src="' + esc(d.qr) + '" alt="QR Code Pix">' : '') +
      '<button class="btn" type="button" id="copiar">' + tt.copiar + '</button>' +
      '<div class="auto">' + (d.automatico ? tt.auto : tt.manual) + '</div>' +
      '<div class="rec">' + tt.recebe + ' <b>' + esc(d.recebedor) + '</b><br>' + tt.doc + ' <b>' +
        esc(String(d.documento || '').replace(/^CNPJ\s*/, '')) + '</b> · ' + esc(d.banco) + '<br>' + tt.confira + '</div></div>' +
      (fora ? '<div class="card wise"><h3>' + tt.wiseT + '</h3><p>' + tt.wise + '</p>' +
        (d.simbolo ? '<p class="nota">' + esc(tt.aprox.replace('{m}', d.simbolo)) + '</p>' : '') + '</div>' : '') +
      /* NAO FUNCIONOU? (25/11/2026, Elodie: Wise e Pix nao funcionaram pra ela). Quem tem
         banco no Brasil paga pelo mesmo QR: a pagina vai pra essa pessoa com um toque. */
      (fora ? '<div class="card wise"><h3>' + tt.ajudaT + '</h3><p>' + tt.ajuda + '</p>' +
      '<button class="btn sec" type="button" id="compartilhar">' + tt.compartilhar + '</button>' +
      '<p class="nota">' + tt.falar + '</p></div>' : '') +
      '<div class="card dep" id="dep" hidden></div>';
    document.getElementById('app').innerHTML = html;
    document.getElementById('copiar').onclick = copiar;
    if (document.getElementById('compartilhar')) document.getElementById('compartilhar').onclick = compartilhar;
    depoimento();
  }
  function telaPago() {
    var tt = t(), d = dados;
    var onde = tt.onde[d.onde] || tt.onde.dia;
    document.getElementById('app').innerHTML =
      '<div class="card estado pago"><div class="ic">✓</div><h1>' + tt.pagoT + '</h1><p>' + tt.pagoP.replace('{c}', esc(d.codigo)) + '</p></div>' +
      '<div class="card">' + linhasDaReserva() +
      (d.resto > 0 ? '<p class="nota" style="margin-top:12px">' + esc(tt.pagoResto.replace('{v}', reais(d.resto)).replace('{onde}', onde)) + '</p>' : '') + '</div>';
  }
  function desenhar() {
    seletor(); rodape();
    if (!dados) return;
    if (dados.status === 'pago') return telaPago();
    if (dados.status === 'cancelada') return telaSimples('', '🚫', t().cancT, t().cancP);
    if (dados.status === 'aguardando') return telaSimples('', '⏳', t().esperaT, t().esperaP);
    return telaPendente();
  }

  /* ---------- copiar ---------- */
  function copiar() {
    var b = document.getElementById('copiar'), cc = dados && dados.copiaECola;
    if (!cc) return;
    function feito() { b.textContent = t().copiado; b.classList.add('ok'); setTimeout(function () { b.textContent = t().copiar; b.classList.remove('ok'); }, 4000); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(cc).then(feito, reserva);
    } else reserva();
    function reserva() {
      var ta = document.createElement('textarea');
      ta.value = cc; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, cc.length);
      try { document.execCommand('copy'); feito(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  /* ---------- mandar a pagina pra quem vai pagar ---------- */
  function compartilhar() {
    var url = location.href.split('#')[0];
    var txt = (dados && dados.codigo ? 'Reserva ' + dados.codigo + ' · ' : '') + 'Portal Ilha da Gigóia — Pix ' + reais(dados && dados.sinal);
    if (navigator.share) { navigator.share({ title: 'Portal Ilha da Gigóia', text: txt, url: url }).catch(function () {}); return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(txt + '\n' + url), '_blank');
  }

  /* ---------- depoimento real (mesma planilha do site) ---------- */
  function depoimento() {
    if (typeof depLerPlanilha !== 'function') return;
    depLerPlanilha().then(function (lista) {
      var box = document.getElementById('dep');
      if (!box || !lista || !lista.length) return;
      var chave = /tijuca/i.test(dados.opcao) ? 'tijuca' : (/pantanal/i.test(dados.opcao) ? 'pantanal' : '');
      var d = (chave && lista.filter(function (x) { return String(x.passeio).toLowerCase().indexOf(chave) > -1; })[0]) || lista[0];
      var n = Math.round(Number(String(d.nota).replace(',', '.'))) || 5;
      box.innerHTML = '<div class="stars">' + '★★★★★'.slice(0, Math.min(5, Math.max(1, n))) + '</div>' +
        '<blockquote>' + esc(d.texto) + '</blockquote><figcaption>— ' + esc(d.nome) + (d.passeio ? ', ' + esc(d.passeio) : '') + '</figcaption>';
      box.hidden = false;
    }).catch(function () {});
  }

  /* ---------- dados ---------- */
  function buscar(soStatus) {
    return fetch('/pagar/dados.php?t=' + encodeURIComponent(token) + (soStatus ? '&s=1' : ''), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { http: r.status, j: j }; }); });
  }
  function acompanhar() {
    clearTimeout(consulta);
    if (!dados || dados.status !== 'pendente') return;
    if (Date.now() - inicio > 3 * 3600 * 1000) return;   // 3 h aberta: para de perguntar
    consulta = setTimeout(function () {
      if (document.hidden) return acompanhar();
      buscar(true).then(function (r) {
        if (r.j && r.j.ok && r.j.status && r.j.status !== 'pendente') {
          dados.status = r.j.status;
          desenhar();
          if (dados.status === 'pago' && navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
          return;
        }
        acompanhar();
      }).catch(acompanhar);
    }, 8000);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) acompanhar(); });

  function iniciar() {
    lang = (function () {
      var n = (navigator.language || 'pt').slice(0, 2).toLowerCase();
      return T[n] ? n : 'pt';
    })();
    seletor(); rodape();
    document.getElementById('t_carregando').textContent = t().carregando;
    if (!token) { telaSimples('', '🔗', t().erroT, t().erroP); return; }
    buscar(false).then(function (r) {
      if (!r.j || !r.j.ok) {
        if (r.http === 404) telaSimples('', '🔗', t().erroT, t().erroP);
        else telaSimples('', '⚠️', t().foraT, t().foraP);
        return;
      }
      dados = r.j;
      if (!escolhida && T[dados.lang]) lang = dados.lang;   // a lingua da conversa com a Gigi
      desenhar();
      acompanhar();
    }).catch(function () { telaSimples('', '⚠️', t().foraT, t().foraP); });
  }
  iniciar();
})();
</script>

</html>
